name: CI & Deploy (public)

on:
  push:
    branches:
      - public
  pull_request:
    branches:
      - public

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build-and-deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/neuercoolername/weather:public

      - name: Deploy on server
        uses: and-fm/cloudflared-ssh-action@v3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          private_key_filename: ${{ secrets.SSH_PRIVATE_KEY_FILENAME }}
          private_key_value: ${{ secrets.SSH_PRIVATE_KEY_VALUE }}
          port: 22
          service_token_id: ${{ secrets.SERVICE_TOKEN_ID }}
          service_token_secret: ${{ secrets.SERVICE_TOKEN_SECRET }}
          # Same server as the private deploy (that's main's own deploy.yml, a different file on a
          # different branch), different compose service — see docker-compose.yml in infra-repo.
          #
          # Postgres for this branch is self-hosted (weather-public-db, a plain Postgres container
          # on the same Docker network), never exposed to the internet — unlike main's Supabase
          # DB, so migrations can't run from the GitHub Actions runner. They run here instead, via
          # `docker compose run` against the same service definition the running container uses,
          # which resolves DATABASE_URL/DIRECT_URL from infra-repo's .env the same way `up` does.
          # `prisma` isn't in the runtime image (Dockerfile strips devDependencies), so it's
          # installed fresh in that one-off run — pin its version to match package.json's when
          # that changes. `--user root` because the image otherwise runs as the non-root `nextjs`
          # user, who can't write to npm's global install path.
          commands: >
            docker compose -f /home/david/projects/infra-repo/docker-compose.yml pull weather-public &&
            docker compose -f /home/david/projects/infra-repo/docker-compose.yml run --rm --no-deps --user root
            weather-public sh -c "npm install -g prisma@6.19.2 && npx prisma migrate deploy" &&
            docker compose -f /home/david/projects/infra-repo/docker-compose.yml up -d weather-public &&
            docker image prune -f
